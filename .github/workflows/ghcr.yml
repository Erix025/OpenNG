name: build-ghcr

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push AMD64 image
        run: |
          docker buildx build --platform linux/amd64 \
            -t ghcr.io/${{ github.repository_owner }}/openng:latest \
            -t ghcr.io/${{ github.repository_owner }}/openng:${{ github.sha }} \
            -f Dockerfile . --push
